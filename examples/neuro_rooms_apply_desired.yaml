alias: Neuro Rooms — zastosuj pożądane
description: "Przykładowa, jedna automatyzacja reagująca na wynik desired z Neuro Rooms."
mode: queued
max: 20
triggers:
  - trigger: state
    entity_id:
      - sensor.neuro_room_biuro_state
      - sensor.neuro_room_salon_state
  - trigger: state
    entity_id: select.neuro_modes_home_mode
actions:
  - variables:
      pokoje:
        - sensor.neuro_room_biuro_state
        - sensor.neuro_room_salon_state
      cele:
        biuro:
          area_id: biuro
          light_entities: [light.biuro]
        salon:
          area_id: salon
          light_entities: [light.salon]
  - repeat:
      for_each: "{{ pokoje }}"
      sequence:
        - variables:
            pokoj_id: "{{ state_attr(repeat.item, 'room_id') }}"
            wanted: "{{ state_attr(repeat.item, 'desired') or {} }}"
            cel: "{{ cele.get(pokoj_id, {}) }}"
        - choose:
            - conditions: "{{ wanted.get('lighting') == 'off' and cel.get('light_entities') }}"
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: "{{ cel.get('light_entities') }}"
            - conditions: "{{ wanted.get('lighting') in ['work', 'normal', 'on'] and cel.get('light_entities') }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ cel.get('light_entities') }}"
                  data:
                    brightness_pct: "{{ 100 if wanted.get('lighting') == 'work' else 70 }}"
        # Celowo testowa obsługa tylko światła. hvac/media pozostają w desired
        # i można je podłączyć po sprawdzeniu rzeczywistych encji w pokojach.
